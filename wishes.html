<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CUSTOMIZE: Change the title -->
    <title>Mitisha &amp; Tirth's Wishes 💖</title>
    <!-- CUSTOMIZE: Change favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./wishes.css">
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="hbd.mp3" type="audio/mpeg">
    </audio>
    <div class="music-toggle" id="musicToggle" title="Toggle Music">
        <span class="music-icon">🎵</span>
    </div>
    <a href="index.html" class="back-btn" title="Go Back">←</a>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="container">
        <!-- CUSTOMIZE: Change the name -->
        <h1>Happy Birthday Mitisha 💖</h1>
        <p class="reasons-subtitle">Reasons why I love you and why you are so special to me! 💕</p>

        <div id="flip-card-container" class="flip-card-container">
            <div id="card-inner" class="card-inner">
                <div class="card-face card-front" id="card-front">
                    <div class="card-badge" id="front-badge">Reason 1 of 6</div>
                    <div class="card-emoji" id="front-emoji">✨</div>
                    <div class="card-text" id="front-text">Loading...</div>
                    <div class="card-hint">Click card or press Next to flip 180° 🔄</div>
                </div>
                <div class="card-face card-back" id="card-back">
                    <div class="card-badge" id="back-badge">Reason 2 of 6</div>
                    <div class="card-emoji" id="back-emoji">🌸</div>
                    <div class="card-text" id="back-text">Loading...</div>
                    <div class="card-hint">Click card or press Next to flip 180° 🔄</div>
                </div>
            </div>
        </div>

        <button class="shuffle-button" id="next-btn">Next Reason 🔄</button>

        <div class="ending-section">
            <div class="teddy-hug">
                <!-- CUSTOMIZE: Change the image -->
                <img src="./photos/first-date.jpg" alt="Our First Date">
            </div>
            <!-- CUSTOMIZE: Change the ending text -->
            <div class="ending-text">Mitisha, You're my everything! 💖</div>
        </div>
    </div>

    <script src="wishes.js"></script>
</body>
</html>
